[package]
name = "scoretracker"
version = "0.1.0"
edition = "2024"
default-run = "scoretracker-toolkit"

[lib]
name = "scoretracker"
path = "src/lib.rs"

[[bin]]
name = "scoretracker-toolkit"
path = "src/cli/main.rs"

[[bin]]
name = "scoretracker-playground"
path = "src/playground/main.rs"

[dependencies]
chrono = "0.4.42"
directories = "6.0.0"
md5 = "0.8.0"
notify = "8.2.0"
serde = { version = "1.0.226", features = ["derive"] }
serde-jsonlines = "0.7.0"
serde_json = "1.0.145"
sha256 = "1.6.0"
thiserror = "2.0.16"
typetag = "0.2.20"
uuid = { version = "1.18.1", features = ["v7"] }
walkdir = "2.5.0"
ctrlc = { version = "3.5.0" }
relative-path = { version = "2.0.1", features = ["serde"] }
calamine = "0.35.0"
iso8601-duration = { version = "0.2.0", features = ["chrono"] }
indexmap = "2.14.0"
regex = "1.12.4"
chrono-tz = "0.10.4"
