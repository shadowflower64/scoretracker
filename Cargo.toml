[package]
name = "scoretracker"
version = "0.1.0"
edition = "2024"
default-run = "scoretracker-toolkit"

[lib]
name = "scoretracker"
path = "src/lib/lib.rs"

[[bin]]
name = "scoretracker-toolkit"
path = "src/toolkit/main.rs"

[[bin]]
name = "scoretracker-server"
path = "src/toolkit/server/main.rs"

[[bin]]
name = "scoretracker-playground"
path = "src/playground/main.rs"

[dependencies]
chrono = "0.4.45"
directories = "6.0.0"
md5 = "0.8.1"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde-jsonlines = "0.7.0"
serde_json = "1.0.151"
sha256 = "1.6.0"
thiserror = "2.0.20"
typetag = "0.2.23"
uuid = { version = "1.26.0", features = ["v7"] }
walkdir = "2.5.0"
ctrlc = { version = "3.5.2" }
relative-path = { version = "2.0.1", features = ["serde"] }
calamine = "0.36.1"
iso8601-duration = { version = "0.2.0", features = ["chrono"] }
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.13.1"
chrono-tz = "0.10.4"
smol = "2.0.2"
crossbeam-channel = "0.5.16"
rand = "0.10.2"
# toml = "1.1.4"
toml_edit = { version = "0.25.13", features = ["serde"] }
fs_extra = "1.3.0"
constcat = "0.6.1"
actix-web = "4.15.0"
actix-files = "0.7.0"
schemars = { version = "1.2.2", features = ["indexmap2", "preserve_order"] }
linkme = "0.3.37"
toml = "1.1.4"
function_name = "0.3.0"
yaml_serde = "0.10.7"
actix-ws = "0.4.0"
rmp-serde = "1.3.1"
